<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Turnos | CLIP Barber Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="admin-header"><a href="index.html" class="brand">CLIP <small>BARBER STUDIO</small></a><a class="preview-link" href="index.html" target="_blank" rel="noopener noreferrer">Ver mi web ↗</a></header>
  <main class="admin-main staff-main">
    <div class="intro"><p>Panel de barbero</p><h1>Tus próximos<br><em>turnos.</em></h1></div>
    <section class="admin-card"><h2>Acceso</h2><div id="staff-login" class="form-grid"><label>Email <input id="staff-email" type="email" autocomplete="email" required></label><label>Contraseña <input id="staff-password" type="password" autocomplete="current-password" required></label></div><div class="actions"><button class="secondary" id="staff-login-button" type="button">Ingresar</button><button class="danger" id="staff-logout-button" type="button" hidden>Salir</button></div><p id="staff-status" class="storage-note" role="status"></p></section>
    <section class="admin-card" id="staff-appointments" hidden><div class="section-title"><div><h2>Reservas</h2><p class="hint">Turnos pendientes de los próximos domingos.</p></div><button class="secondary" id="staff-refresh" type="button">Actualizar</button></div><div id="staff-empty">Todavía no hay reservas próximas.</div><div class="appointments-table-wrap" id="staff-table-wrap"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Cliente</th><th>WhatsApp</th><th>Servicio</th></tr></thead><tbody id="staff-appointments-body"></tbody></table></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
  <script src="supabase-config.js"></script>
  <script src="barbero.js"></script>
</body>
</html>
